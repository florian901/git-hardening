<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Lifecycle of a runtime secret: 1Password vault to systemd credential</title>
  <desc id="desc">A secret travels from the 1Password vault through op read, an anonymous pipe, and the SSH channel to the instance, where systemd-creds seals it to the NitroTPM as a ciphertext blob on disk. At every service start, PID 1 unseals the blob via the TPM into a ramfs file in the service's private CREDENTIALS_DIRECTORY. Plaintext exists only in pipes, process memory, and ramfs — never at rest.</desc>
  <style>
    /* Literal colors only — no var()/@media: renderers like resvg (Zed preview)
       support neither and would paint every var() fill black. Palette is chosen
       to stay legible on both light and dark page backgrounds. */
    text { fill: #24292f; }
    .muted { fill: #6e7981; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .zone { fill: none; stroke: #8b98a5; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 10; }
    .zonelabel { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #6e7981; }
    .plain { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
    .enc { fill: #ccfbf1; stroke: #0f766e; stroke-width: 1.5; }
    .proc { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
    .name { font-size: 13px; font-weight: 600; }
    .det { font-size: 11px; }
    .flow { stroke: #6e7981; stroke-width: 1.5; fill: none; marker-end: url(#head); }
    .flowlabel { font-size: 11px; }
    .step { font-size: 10px; font-weight: 700; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6e7981"/>
    </marker>
  </defs>

  <!-- ===================== Laptop zone ===================== -->
  <rect class="zone" x="20" y="34" width="920" height="130" rx="10"/>
  <text class="zonelabel" x="36" y="24">LAPTOP <tspan class="muted" font-weight="400">— authorization anchor (biometric unlock)</tspan></text>

  <!-- 1: vault -->
  <rect class="enc" x="44" y="60" width="170" height="72" rx="8"/>
  <text class="name" x="129" y="86" text-anchor="middle">1Password vault</text>
  <text class="det muted" x="129" y="104" text-anchor="middle">encrypted at rest</text>
  <circle cx="44" cy="60" r="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text class="step" x="44" y="63.5" text-anchor="middle">1</text>

  <!-- arrow vault -> op read -->
  <line class="flow" x1="214" y1="96" x2="268" y2="96"/>

  <!-- 2: op read -->
  <rect class="plain" x="270" y="60" width="180" height="72" rx="8"/>
  <text class="name mono" x="360" y="86" text-anchor="middle">op read</text>
  <text class="det muted" x="360" y="104" text-anchor="middle">plaintext in process memory</text>
  <circle cx="270" cy="60" r="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="step" x="270" y="63.5" text-anchor="middle">2</text>

  <!-- arrow op read -> ssh (anonymous pipe) -->
  <line class="flow" x1="450" y1="96" x2="574" y2="96"/>
  <text class="flowlabel muted" x="512" y="82" text-anchor="middle">anonymous pipe</text>
  <text class="flowlabel muted" x="512" y="152" text-anchor="middle">never argv · ps · history</text>

  <!-- 3: ssh stdin -->
  <rect class="plain" x="576" y="60" width="180" height="72" rx="8"/>
  <text class="name mono" x="666" y="86" text-anchor="middle">ssh</text>
  <text class="det muted" x="666" y="104" text-anchor="middle">secret rides stdin</text>
  <circle cx="576" cy="60" r="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="step" x="576" y="63.5" text-anchor="middle">3</text>

  <!-- ===================== Transit ===================== -->
  <path class="flow" d="M 756 96 H 880 V 216 H 806"/>
  <text class="flowlabel muted" x="868" y="178" text-anchor="end">SSH channel over SSM</text>
  <text class="flowlabel muted" x="868" y="192" text-anchor="end">encrypted in transit · no inbound :22</text>
  <circle cx="880" cy="96" r="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text class="step" x="880" y="99.5" text-anchor="middle">4</text>

  <!-- ===================== EC2 zone ===================== -->
  <rect class="zone" x="20" y="196" width="920" height="424" rx="10"/>
  <text class="zonelabel" x="36" y="188">EC2 INSTANCE <tspan class="muted" font-weight="400">— NitroTPM-enabled, swap off, coredumps off</tspan></text>

  <!-- Row A: delivered once (right to left) -->
  <text class="det muted" x="36" y="222" font-style="italic">delivered once, laptop session open — Phase 4.1</text>

  <!-- 5: systemd-creds encrypt -->
  <rect class="plain" x="576" y="238" width="228" height="72" rx="8"/>
  <text class="name mono" x="690" y="264" text-anchor="middle">systemd-creds encrypt</text>
  <text class="det muted" x="690" y="282" text-anchor="middle">reads stdin · plaintext in memory only</text>
  <circle cx="576" cy="238" r="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="step" x="576" y="241.5" text-anchor="middle">5</text>

  <!-- TPM chip -->
  <rect class="proc" x="576" y="356" width="228" height="60" rx="8"/>
  <text class="name" x="690" y="380" text-anchor="middle">NitroTPM</text>
  <text class="det muted" x="690" y="398" text-anchor="middle">wraps the key · key never leaves the chip</text>

  <!-- encrypt <-> TPM -->
  <line class="flow" x1="662" y1="310" x2="662" y2="354"/>
  <line class="flow" x1="718" y1="354" x2="718" y2="312"/>
  <text class="flowlabel muted mono" x="650" y="337" text-anchor="end">--with-key=tpm2</text>

  <!-- arrow encrypt -> blob -->
  <line class="flow" x1="574" y1="274" x2="452" y2="274"/>

  <!-- 6: sealed blob on disk -->
  <rect class="enc" x="222" y="238" width="228" height="72" rx="8"/>
  <text class="name mono" x="336" y="258" text-anchor="middle" font-size="12">/etc/credstore.encrypted/</text>
  <text class="name mono" x="336" y="274" text-anchor="middle" font-size="12">db-password.cred</text>
  <text class="det muted" x="336" y="296" text-anchor="middle">ciphertext on disk — survives reboot</text>
  <circle cx="222" cy="238" r="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text class="step" x="222" y="241.5" text-anchor="middle">6</text>
  <text class="det muted" x="336" y="330" text-anchor="middle">an EBS snapshot of this file is useless:</text>
  <text class="det muted" x="336" y="346" text-anchor="middle">nothing on disk contributes to decryption</text>

  <!-- divider -->
  <line x1="40" y1="440" x2="920" y2="440" stroke="#8b98a5" stroke-width="1" stroke-dasharray="2 4"/>
  <text class="det muted" x="150" y="464" font-style="italic">every service start, laptop long gone — Phase 4.2</text>

  <!-- arrow blob -> PID1 -->
  <path class="flow" d="M 222 274 H 130 V 494 H 218"/>

  <!-- 7: PID 1 unseal -->
  <rect class="proc" x="220" y="480" width="228" height="72" rx="8"/>
  <text class="name" x="334" y="500" text-anchor="middle">PID 1 (systemd)</text>
  <text class="name mono" x="334" y="518" text-anchor="middle" font-size="11.5">LoadCredentialEncrypted=</text>
  <text class="det muted" x="334" y="538" text-anchor="middle">unseals via TPM before ExecStart</text>
  <circle cx="220" cy="480" r="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="step" x="220" y="483.5" text-anchor="middle">7</text>

  <!-- PID1 <-> TPM -->
  <path class="flow" d="M 448 500 H 662 V 418"/>
  <text class="flowlabel muted" x="556" y="490" text-anchor="middle">unseal (this chip only)</text>

  <!-- arrow PID1 -> ramfs -->
  <path class="flow" d="M 334 552 V 586 H 468"/>

  <!-- 8: ramfs credential -->
  <rect class="plain" x="470" y="548" width="270" height="76" rx="8"/>
  <text class="name mono" x="605" y="572" text-anchor="middle" font-size="12">$CREDENTIALS_DIRECTORY/</text>
  <text class="name mono" x="605" y="588" text-anchor="middle" font-size="12">db-password</text>
  <text class="det muted" x="605" y="608" text-anchor="middle">ramfs · 0700 · unit-private · gone on stop</text>
  <circle cx="470" cy="548" r="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="step" x="470" y="551.5" text-anchor="middle">8</text>

  <!-- arrow ramfs -> myapp -->
  <line class="flow" x1="740" y1="586" x2="812" y2="586"/>

  <!-- 9: service -->
  <rect class="proc" x="814" y="556" width="106" height="60" rx="8"/>
  <text class="name mono" x="867" y="580" text-anchor="middle">myapp</text>
  <text class="det muted" x="867" y="598" text-anchor="middle">reads a file</text>
  <circle cx="814" cy="556" r="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="step" x="814" y="559.5" text-anchor="middle">9</text>

  <!-- ===================== Legend ===================== -->
  <rect class="plain" x="36" y="648" width="26" height="14" rx="3"/>
  <text class="det" x="70" y="659">plaintext — pipes, process memory, ramfs only</text>
  <rect class="enc" x="360" y="648" width="26" height="14" rx="3"/>
  <text class="det" x="394" y="659">ciphertext — the only form that ever rests on disk</text>
  <rect class="proc" x="712" y="648" width="26" height="14" rx="3"/>
  <text class="det" x="746" y="659">process / hardware</text>
</svg>
