<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 900" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Transport stack for ssh over SSM: who authenticates what, at which hop</title>
  <desc id="desc">A single ssh prov-i-… command descends through eight hops. On the laptop: the ssh client reads ~/.ssh/config and points IdentityAgent at the 1Password agent socket for the user key; ProxyCommand runs ~/bin/aws-op; op plugin run applies the 1Password biometric gate on the static-key path (on the SSO path the gate is the aws sso login token instead); aws ssm start-session is authorized by IAM and recorded in CloudTrail. On the AWS and instance side: SSM Session Manager brokers the tunnel, the outbound-only SSM agent dials out with no inbound port 22 in a private subnet, local sshd answers, and login uses the 60-second EC2 Instance Connect key. Each hop is annotated with the credential or authority it consumes.</desc>
  <style>
    /* Literal colors only — no var()/@media: renderers like resvg (Zed preview)
       support neither and would paint every var() fill black. Palette is chosen
       to stay legible on both light and dark page backgrounds. */
    text { fill: #24292f; }
    .muted { fill: #6e7981; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .zone { fill: none; stroke: #8b98a5; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .zonelabel { font-size: 13px; font-weight: 700; letter-spacing: .04em; fill: #6e7981; }
    .plain { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
    .enc { fill: #ccfbf1; stroke: #0f766e; stroke-width: 1.5; }
    .proc { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
    .name { font-size: 13px; font-weight: 600; }
    .det { font-size: 11px; }
    .flow { stroke: #6e7981; stroke-width: 1.5; fill: none; marker-end: url(#head); }
    .flowlabel { font-size: 11px; }
    .step { font-size: 10px; font-weight: 700; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6e7981"/>
    </marker>
  </defs>

  <!-- ===================== Laptop zone ===================== -->
  <rect class="zone" x="20" y="64" width="900" height="350" rx="10"/>
  <text class="zonelabel" x="36" y="54">LAPTOP <tspan class="muted" font-weight="400">— what each hop consumes on the client side</tspan></text>

  <!-- 1: ssh client -->
  <rect class="proc" x="48" y="84" width="430" height="60" rx="8"/>
  <text class="name mono" x="263" y="108" text-anchor="middle">ssh client</text>
  <text class="det muted" x="263" y="126" text-anchor="middle">reads ~/.ssh/config · IdentityAgent</text>
  <circle cx="48" cy="84" r="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="step" x="48" y="87.5" text-anchor="middle">1</text>
  <text class="det muted" x="505" y="110">IdentityAgent points at the 1P agent socket; the user key</text>
  <text class="det muted" x="505" y="126">signs here — its private half never leaves the vault.</text>

  <line class="flow" x1="263" y1="144" x2="263" y2="168"/>

  <!-- 2: ProxyCommand -->
  <rect class="proc" x="48" y="170" width="430" height="60" rx="8"/>
  <text class="name mono" x="263" y="194" text-anchor="middle">ProxyCommand → ~/bin/aws-op</text>
  <text class="det muted" x="263" y="212" text-anchor="middle">non-interactive wrapper</text>
  <circle cx="48" cy="170" r="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="step" x="48" y="173.5" text-anchor="middle">2</text>
  <text class="det muted" x="505" y="196">Routes a non-interactive shell through 1Password — the 0.3</text>
  <text class="det muted" x="505" y="212">alias reaches only interactive shells, not ProxyCommand.</text>

  <line class="flow" x1="263" y1="230" x2="263" y2="254"/>

  <!-- 3: op plugin run -->
  <rect class="enc" x="48" y="256" width="430" height="60" rx="8"/>
  <text class="name mono" x="263" y="280" text-anchor="middle">op plugin run</text>
  <text class="det muted" x="263" y="298" text-anchor="middle">the authorization gate</text>
  <circle cx="48" cy="256" r="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text class="step" x="48" y="259.5" text-anchor="middle">3</text>
  <text class="det muted" x="505" y="282">Static-key path: the 1Password biometric prompt fires here.</text>
  <text class="det muted" x="505" y="298">SSO path: the gate is the aws sso login token instead.</text>

  <line class="flow" x1="263" y1="316" x2="263" y2="340"/>

  <!-- 4: aws ssm start-session -->
  <rect class="proc" x="48" y="342" width="430" height="60" rx="8"/>
  <text class="name mono" x="263" y="366" text-anchor="middle">aws ssm start-session</text>
  <text class="det muted" x="263" y="384" text-anchor="middle">IAM-authorized · CloudTrail-audited</text>
  <circle cx="48" cy="342" r="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="step" x="48" y="345.5" text-anchor="middle">4</text>
  <text class="det muted" x="505" y="368">IAM authorizes ssm:StartSession; the call is recorded in</text>
  <text class="det muted" x="505" y="384">CloudTrail under your identity — the second trust anchor.</text>

  <!-- transport crossing -->
  <line class="flow" x1="263" y1="402" x2="263" y2="454"/>

  <!-- ===================== AWS + instance zone ===================== -->
  <rect class="zone" x="20" y="440" width="900" height="348" rx="10"/>
  <text class="zonelabel" x="36" y="430">AWS + INSTANCE</text>
  <text class="det muted" x="900" y="430" text-anchor="end" font-style="italic">outbound-only · no inbound :22 · private subnet</text>

  <!-- 5: SSM Session Manager -->
  <rect class="proc" x="48" y="456" width="430" height="60" rx="8"/>
  <text class="name" x="263" y="480" text-anchor="middle">SSM Session Manager</text>
  <text class="det muted" x="263" y="498" text-anchor="middle">AWS side — brokers the tunnel</text>
  <circle cx="48" cy="456" r="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="step" x="48" y="459.5" text-anchor="middle">5</text>
  <text class="det muted" x="505" y="482">Relays the encrypted channel; nothing inbound is opened.</text>
  <text class="det muted" x="505" y="498">Session activity is logged on the AWS side.</text>

  <!-- AWS / instance divider -->
  <line x1="40" y1="528" x2="900" y2="528" stroke="#8b98a5" stroke-width="1" stroke-dasharray="2 4"/>
  <text class="det muted" x="900" y="524" text-anchor="end" font-style="italic">above: AWS control plane · below: the instance</text>

  <line class="flow" x1="263" y1="516" x2="263" y2="542"/>

  <!-- 6: SSM agent -->
  <rect class="proc" x="48" y="544" width="430" height="60" rx="8"/>
  <text class="name" x="263" y="568" text-anchor="middle">SSM agent</text>
  <text class="det muted" x="263" y="586" text-anchor="middle">outbound-only, dials out to AWS</text>
  <circle cx="48" cy="544" r="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="step" x="48" y="547.5" text-anchor="middle">6</text>
  <text class="det muted" x="505" y="570">The agent originates the connection — no inbound port 22,</text>
  <text class="det muted" x="505" y="586">no public IP; the instance sits in a private subnet.</text>

  <line class="flow" x1="263" y1="604" x2="263" y2="628"/>

  <!-- 7: sshd -->
  <rect class="proc" x="48" y="630" width="430" height="60" rx="8"/>
  <text class="name mono" x="263" y="654" text-anchor="middle">sshd</text>
  <text class="det muted" x="263" y="672" text-anchor="middle">local SSH server</text>
  <circle cx="48" cy="630" r="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="step" x="48" y="633.5" text-anchor="middle">7</text>
  <text class="det muted" x="505" y="656">The real SSH server, reachable only through the SSM tunnel</text>
  <text class="det muted" x="505" y="672">that hop 6 established — never from the open internet.</text>

  <line class="flow" x1="263" y1="690" x2="263" y2="714"/>

  <!-- 8: EIC login -->
  <rect class="plain" x="48" y="716" width="430" height="60" rx="8"/>
  <text class="name" x="263" y="740" text-anchor="middle">login via 60-second EIC key</text>
  <text class="det muted" x="263" y="758" text-anchor="middle">ephemeral keypair from 1.3</text>
  <circle cx="48" cy="716" r="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text class="step" x="48" y="719.5" text-anchor="middle">8</text>
  <text class="det muted" x="505" y="742">A public key pushed via EC2 Instance Connect, valid 60</text>
  <text class="det muted" x="505" y="758">seconds; no standing authorized_keys entry is left behind.</text>

  <!-- ===================== Legend ===================== -->
  <rect class="enc" x="48" y="812" width="26" height="14" rx="3"/>
  <text class="det" x="82" y="823">the biometric / token authorization gate</text>
  <rect class="proc" x="430" y="812" width="26" height="14" rx="3"/>
  <text class="det" x="464" y="823">infrastructure hop</text>
  <rect class="plain" x="640" y="812" width="26" height="14" rx="3"/>
  <text class="det" x="674" y="823">short-lived ephemeral key</text>
</svg>
